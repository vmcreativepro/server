<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pose Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0d10; --panel:#15171c; --panel-2:#1d2027; --line:#282c35;
    --text:#eceef2; --dim:#9199a8; --faint:#666e7d;
    --accent:#e8834a; --accent-ink:#14100c;
    --ok:#63d69a; --bad:#ff8b8b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:400 15px/1.55 "Instrument Sans",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}

  header{display:flex;align-items:center;gap:14px;padding:16px 24px;border-bottom:1px solid var(--line);
         background:var(--panel);position:sticky;top:0;z-index:10}
  header h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none}
  .dot.on{background:var(--ok)}
  header .spacer{margin-left:auto}
  .link{background:none;border:0;color:var(--dim);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline}
  .link:hover{color:var(--text)}

  #setup{padding:16px 24px;border-bottom:1px solid var(--line);background:var(--panel-2);display:none}
  #setup.open{display:block}
  #setup .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;max-width:760px}
  #setup p{margin:0 0 12px;color:var(--dim);font-size:14px;max-width:70ch}
  #setup a{color:var(--accent)}

  .bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto auto auto;gap:12px;
       padding:16px 24px;border-bottom:1px solid var(--line);align-items:end}
  @media(max-width:900px){.bar{grid-template-columns:1fr 1fr}}
  @media(max-width:560px){.bar{grid-template-columns:1fr}}

  label{display:block;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
        color:var(--faint);margin-bottom:6px}
  select,input,textarea{width:100%;font:inherit;font-size:14px;color:var(--text);background:var(--panel-2);
        border:1px solid var(--line);border-radius:8px;padding:9px 10px}
  select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{
        outline:2px solid var(--accent);outline-offset:2px}
  textarea{resize:vertical;min-height:40px}

  button.go{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 22px;
        font:inherit;font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap}
  button.go:disabled{opacity:.55;cursor:not-allowed}
  button.ghost{background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:8px;
        padding:9px 14px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
  button.ghost:hover{border-color:var(--accent)}

  .detail{padding:0 24px 16px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
  .detail .grow{flex:1 1 320px}

  .msg{margin:0 24px 16px;padding:11px 14px;border-radius:8px;font-size:14px;
       background:#3a1d20;color:#ffc9c9;border:1px solid #5e2a2e}
  .msg:empty{display:none}

  main{padding:8px 24px 80px}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  figure img{display:block;width:100%;height:auto;background:var(--panel-2)}
  figcaption{display:flex;justify-content:space-between;align-items:center;gap:8px;
       padding:9px 12px;font-size:12px;color:var(--faint)}
  figcaption a{color:var(--accent);text-decoration:none;font-weight:600}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:30px 16px;
       text-align:center;color:var(--dim);font-size:14px}
  .card.err{color:var(--bad)}
  .spin{width:20px;height:20px;margin:0 auto 10px;border-radius:50%;
       border:2px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){.spin{animation:none}}
  .none{color:var(--faint);font-size:14px;padding:30px 0}
</style>
</head>
<body>

<header>
  <span class="dot" id="dot"></span>
  <h1>Pose Studio</h1>
  <span class="spacer"></span>
  <button class="link" id="toggleSetup" type="button">Setup</button>
</header>

<section id="setup">
  <p id="setupNote"></p>
  <div class="row">
    <div style="flex:1 1 260px">
      <label for="provider">Image service</label>
      <select id="provider"></select>
    </div>
    <div style="flex:1 1 300px" id="keyWrap">
      <label for="key" id="keyLabel">API key</label>
      <input id="key" type="password" autocomplete="off" spellcheck="false">
    </div>
    <button class="go" id="saveSetup" type="button">Save</button>
    <span id="keyState" style="color:var(--dim);font-size:14px"></span>
  </div>
</section>

<div class="bar">
  <div><label for="pose">Pose</label><select id="pose"></select></div>
  <div><label for="view">View</label><select id="view"></select></div>
  <div><label for="setting">Setting</label><select id="setting"></select></div>
  <div><label for="aspect">Shape</label><select id="aspect"></select></div>
  <div><label for="count">How many</label><select id="count"></select></div>
  <div><label>&nbsp;</label><button class="go" id="go" type="button">Generate</button></div>
</div>

<div class="detail">
  <div class="grow">
    <label for="extra">Anything else <span style="text-transform:none;font-weight:400">(optional)</span></label>
    <textarea id="extra" rows="1" placeholder="pale skin, freckles, chipped blue polish"></textarea>
  </div>
  <button class="ghost" id="showPrompt" type="button">See prompt</button>
</div>

<p class="msg" id="msg"></p>

<main>
  <div class="grid" id="grid"><p class="none">Nothing generated yet.</p></div>
</main>

<script type="module" src="/app.js"></script>
</body>
</html>
